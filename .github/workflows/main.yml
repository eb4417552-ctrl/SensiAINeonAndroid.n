name: Build SENSI AI NEON

on:
workflow_dispatch:
push:
paths:
- 'SensiAINeonAndroid.zip'
- '.github/workflows/main.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - name: Install tools
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract project
    run: |
      mkdir extracted
      unzip -q SensiAINeonAndroid.zip -d extracted
      find extracted -type f -name settings.gradle -exec dirname {} \; > project_path.txt
      test -s project_path.txt
      echo "PROJECT_DIR=$(head -n 1 project_path.txt)" >> "$GITHUB_ENV"

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  - name: Build APK
    run: gradle -p "$PROJECT_DIR" assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: SENSI-AI-NEON-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
